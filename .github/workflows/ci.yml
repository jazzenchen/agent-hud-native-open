name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check source boundaries
        run: python3 scripts/check-source-boundaries.py
      - name: Test
        run: swift test

  app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build application
        run: scripts/build-app.sh release
      - name: Verify local signature and resources
        run: |
          codesign --verify --deep --strict "build/Agent HUD Open.app"
          bundle="build/Agent HUD Open.app/Contents/Resources/AgentHUDOpen_AgentHUDDesktop.bundle"
          test -f "$bundle/claude.png" || test -f "$bundle/Contents/Resources/claude.png"
          prices="build/Agent HUD Open.app/Contents/Resources/AgentHUDOpen_AgentHUDCore.bundle"
          test -f "$prices/model-prices.json" || test -f "$prices/Contents/Resources/model-prices.json"
          test ! -e "build/Agent HUD Open.app/Contents/embedded.provisionprofile"
          xcrun vtool -show-build "build/Agent HUD Open.app/Contents/MacOS/Agent HUD Open" \
            | awk '/minos/ { minos = $2 } /sdk/ { sdk = $2 } END { exit sdk == minos }'

  # The check main's ruleset requires: green only when the tests and the application both are.
  macos:
    needs: [test, app]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tests and application passed
        run: test "${{ needs.test.result }}" = success && test "${{ needs.app.result }}" = success
