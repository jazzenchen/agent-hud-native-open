name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check source boundaries
        run: python3 scripts/check-source-boundaries.py
      - name: Test
        run: swift test
      - name: Build application
        run: scripts/build-app.sh release
      - name: Verify local signature and resources
        run: |
          codesign --verify --deep --strict "build/Agent HUD Open.app"
          bundle="build/Agent HUD Open.app/Contents/Resources/AgentHUDOpen_AgentHUDDesktop.bundle"
          test -f "$bundle/claude.png" || test -f "$bundle/Contents/Resources/claude.png"
          test ! -e "build/Agent HUD Open.app/Contents/embedded.provisionprofile"
          xcrun vtool -show-build "build/Agent HUD Open.app/Contents/MacOS/Agent HUD Open" \
            | awk '/minos/ { minos = $2 } /sdk/ { sdk = $2 } END { exit sdk == minos }'

  windows:
    # The interface is macOS-only; Windows builds the platform-neutral record, data source and storage layers, and the
    # executable's hook, adapter and probe commands.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.4.1"
      - name: Check source boundaries
        run: python scripts/check-source-boundaries.py
      - name: Test
        run: swift test
